<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f3ee">
  <title>アーカイブサイト</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f5f3ee;
      --ink: #252720;
      --muted: #77796f;
      --line: #d9d8d0;
      --accent: #78816b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Yu Mincho", "Hiragino Mincho ProN", "Noto Serif JP", serif;
      -webkit-font-smoothing: antialiased;
    }
    .side-botanical {
      position: fixed;
      z-index: 0;
      top: 0;
      width: clamp(170px, 23vw, 330px);
      height: 100vh;
      color: #557744;
      opacity: .38;
      pointer-events: none;
    }
    .side-botanical-left { left: 0; }
    .side-botanical-right { right: 0; transform: scaleX(-1); }
    .page { position: relative; z-index: 1; width: min(1440px, 100% - 64px); margin: 0 auto; }
    header {
      min-height: 184px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
      gap: 24px;
    }
    .eyebrow, .count, .item-name, .word {
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", sans-serif;
      letter-spacing: .1em;
    }
    .eyebrow { margin: 0 0 12px; color: var(--muted); font-size: 11px; }
    h1 { margin: 0; font-size: clamp(30px, 4vw, 48px); font-weight: 500; letter-spacing: .08em; }
    .count { color: var(--muted); font-size: 12px; white-space: nowrap; }
    main { padding: 38px 0 76px; }
    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 42px 24px; }
    .card { min-width: 0; }
    .photo-button {
      display: block; width: 100%; padding: 0; border: 0; background: transparent;
      cursor: zoom-in; overflow: hidden;
    }
    .photo-button img { display: block; width: 100%; height: clamp(280px, 35vw, 520px); object-fit: contain; transition: transform .45s ease; }
    .photo-button:hover img { transform: scale(1.025); }
    .caption { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding-top: 14px; }
    .item-name { margin: 0; font-size: 13px; font-weight: 500; }
    .word { margin: 0; color: var(--muted); font-size: 12px; }
    footer { border-top: 1px solid var(--line); padding: 18px 0 28px; color: var(--muted); font: 11px/1.6 "Yu Gothic", "Hiragino Kaku Gothic ProN", sans-serif; letter-spacing: .08em; }
    dialog { width: min(96vw, 1500px); max-width: none; height: min(94vh, 1100px); padding: 20px; border: 1px solid var(--line); background: var(--paper); }
    dialog::backdrop { background: rgb(23 24 20 / 82%); }
    dialog img { display: block; width: 100%; height: calc(100% - 38px); object-fit: contain; }
    .close { display: block; margin: 0 0 10px auto; border: 0; background: none; color: var(--ink); font: 12px "Yu Gothic", sans-serif; letter-spacing: .12em; cursor: pointer; }
    @media (min-width: 1500px) { .photo-button img { height: 500px; } }
    @media (max-width: 900px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px 18px; } .photo-button img { height: clamp(260px, 54vw, 450px); } }
    @media (max-width: 560px) {
      .page { width: calc(100% - 36px); }
      header { min-height: 144px; align-items: flex-end; padding: 32px 0 20px; }
      h1 { font-size: 32px; }
      .count { font-size: 10px; padding-bottom: 5px; }
      main { padding: 24px 0 48px; }
      .grid { grid-template-columns: 1fr; gap: 30px; }
      .photo-button img { height: min(112vw, 560px); }
      .caption { padding-top: 11px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
  </style>
</head>

  <div class="page">
    <header>
      <div>
        <p class="eyebrow">PHOTO ARCHIVE</p>
        <h1>アーカイブサイト</h1>
      </div>
<span class="count" id="count"></span>
    </header>
    <main>
      <section class="grid" id="gallery" aria-label="写真一覧"></section>
    </main>
    <footer>アーカイブサイト</footer>
  </div>

  <dialog id="viewer" aria-label="写真を拡大表示">
    <button class="close" id="close" type="button">閉じる ×</button>
    <img id="viewer-image" alt="">
  </dialog>

  <script>
    const photos = [
      { name: "01", src: "images/01.jpg" },
      { name: "02", src: "images/02.jpg" },
      { name: "03", src: "images/03.jpg" },
      { name: "04", src: "images/04.jpg" },
      { name: "05", src: "images/05.jpg" }
    ];

    const gallery = document.querySelector("#gallery");
    const viewer = document.querySelector("#viewer");
    const viewerImage = document.querySelector("#viewer-image");
    document.querySelector("#count").textContent = `${String(photos.length).padStart(2, "0")} 枚`;

    for (const photo of photos) {
      const card = document.createElement("article");
      card.className = "card";
      const button = document.createElement("button");
      button.className = "photo-button";
      button.type = "button";
      button.setAttribute("aria-label", `${photo.name} を拡大表示`);
      const image = document.createElement("img");
      image.src = photo.src;
      image.alt = photo.name;
      image.loading = "lazy";
      button.append(image);
      button.addEventListener("click", () => {
        viewerImage.src = photo.src;
        viewerImage.alt = photo.name;
        viewer.showModal();
      });
      const caption = document.createElement("div");
      caption.className = "caption";
      const name = document.createElement("h2");
      name.className = "item-name";
      name.textContent = photo.name;
      const word = document.createElement("p");
      word.className = "word";
      word.textContent = "（ここに言葉）";
      caption.append(name, word);
      card.append(button, caption);
      gallery.append(card);
    }

    document.querySelector("#close").addEventListener("click", () => viewer.close());
    viewer.addEventListener("click", event => {
      if (event.target === viewer) viewer.close();
    });
    viewer.addEventListener("close", () => { viewerImage.removeAttribute("src"); });
  </script>
